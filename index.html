<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="description" content="Lega — track your wallets, transactions, and spending in one simple place." />
<meta name="theme-color" content="#0b7a43" />
<title>Lega</title>

<!-- Ikon & font sengaja disamakan dengan app vanilla (personal-wallet/index.html):
     tidak ada web font yang dimuat, sehingga stack --font di design-system.css
     dipakai apa adanya di kedua app. -->
<link rel="icon" href="/favicon.ico" sizes="48x48" />
<link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<!-- Shown until React mounts, so a slow cold start isn't an empty screen. -->
<style>
html,body{margin:0;background:#f4f6f4}
.boot-splash{position:fixed;inset:0;display:grid;place-items:center;background:#f4f6f4}
.boot-splash img{width:96px;height:96px}
</style>
</head>
<body>
<div id="root"><div class="boot-splash" aria-label="Lega"><img src="/brand/lega-app-icon.svg" alt="" /></div></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
